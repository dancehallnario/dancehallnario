<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dancehall Steps A-Z</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


    <!-- =====================================
         ENCABEZADO
    ====================================== -->

    <header class="hero">

        <div class="hero-overlay">

            <p class="country">
                JAMAICA · DANCEHALL
            </p>

            <h1>
           DANCEHALLNARIO
                <span>STEPS A-Z</span>
            </h1>

            <p class="intro">
                Explora, aprende y conoce
                los pasos que forman parte
                de la cultura Dancehall.
            </p>

        </div>

    </header>



    <!-- =====================================
         CONTENIDO
    ====================================== -->

    <main>

        <section class="explore">


            <!-- =================================
                 BUSCADOR
            ================================== -->

            <div class="search-section">

                <h2>
                    Buscar un paso
                </h2>

                <p class="section-description">
                    Escribe el nombre del paso que estás buscando.
                </p>


                <div class="search-box">

                    <span class="search-icon">
                        🔍
                    </span>

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Ejemplo: Bogle..."
                        autocomplete="off"
                    >

                </div>


                <div id="searchResults"></div>

            </div>



            <!-- =================================
                 A-Z
            ================================== -->

            <div class="alphabet-section">

                <h2>
                    Explora los pasos
                </h2>

                <p class="section-description">
                    Selecciona una letra para
                    descubrir los pasos registrados.
                </p>


                <div id="alphabet"></div>


                <div id="stepsList"></div>

            </div>



            <!-- =================================
                 FICHA DEL PASO
            ================================== -->

            <div id="stepDetail"></div>


        </section>

    </main>



    <script src="app.js"></script>


</body>

</html>
